server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: campus-dining
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:bootstrap}
  jackson:
    time-zone: Asia/Shanghai
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  level:
    com.sky: info
sky:
  dish:
    image-directory: ${DISH_IMAGE_DIRECTORY:.runtime/product-images}
    # 未配置时允许无图新增，但拒绝外部图片地址；多个受控域名用逗号分隔。
    allowed-image-hosts: ${DISH_IMAGE_HOSTS:}
  jwt:
    secret-key: ${JWT_SECRET_KEY:campus-dining-local-development-secret-key-change-me}
    ttl: ${JWT_TTL:2h}
