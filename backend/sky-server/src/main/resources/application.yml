server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: campus-dining
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:bootstrap}
  jackson:
    time-zone: Asia/Shanghai
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  level:
    com.sky: info
sky:
  dish:
    image-directory: ${DISH_IMAGE_DIRECTORY:.runtime/product-images}
    # 未配置时允许无图新增，但拒绝外部图片地址；多个受控域名用逗号分隔。
    allowed-image-hosts: ${DISH_IMAGE_HOSTS:}
  jwt:
    secret-key: ${JWT_SECRET_KEY:campus-dining-local-development-secret-key-change-me}
    ttl: ${JWT_TTL:2h}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
  menu-cache:
    prefix: ${MENU_CACHE_PREFIX:campus:local:menu:catalog:v1}
  payment:
    channel: ${PAYMENT_CHANNEL:MOCK}
  agent:
    # 密钥只从环境变量注入；未配置时 /api/agent/chat 明确 503，不伪造模型结果。
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    enabled: ${AGENT_ENABLED:true}
    model-timeout-ms: ${AGENT_MODEL_TIMEOUT_MS:5000}
    total-budget-ms: ${AGENT_TOTAL_BUDGET_MS:15000}
    max-model-calls: ${AGENT_MAX_MODEL_CALLS:5}
    max-tool-calls: ${AGENT_MAX_TOOL_CALLS:8}
    max-context-chars: ${AGENT_MAX_CONTEXT_CHARS:32000}
    max-tool-result-chars: ${AGENT_MAX_TOOL_RESULT_CHARS:8000}
    max-tool-result-rows: ${AGENT_MAX_TOOL_RESULT_ROWS:20}
    session-ttl-hours: ${AGENT_SESSION_TTL_HOURS:24}
    max-visible-messages: ${AGENT_MAX_VISIBLE_MESSAGES:30}
    action-ttl-minutes: ${AGENT_ACTION_TTL_MINUTES:5}
  ws:
    # 生产环境按实际域名收紧，并通过 Nginx 代理 Upgrade/Connection 使用 WSS。
    ticket-prefix: ${WS_TICKET_PREFIX:campus:local:ws:ticket}
    allowed-origins: "${WS_ALLOWED_ORIGINS:http://127.0.0.1:[*],http://localhost:[*]}"
  orders:
    timeout-task-enabled: ${ORDER_TIMEOUT_TASK_ENABLED:true}
    housekeeping-task-enabled: ${ORDER_HOUSEKEEPING_TASK_ENABLED:true}
