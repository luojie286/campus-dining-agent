services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_dining
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Please set DB_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - campus_mysql:/var/lib/mysql
    restart: unless-stopped
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - campus_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
volumes:
  campus_mysql:
  campus_redis:
